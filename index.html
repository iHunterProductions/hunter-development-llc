<!DOCTYPE html>
<html>
<head>
  <title>iHunter Game Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #00c8c8;
    }

    #userDisplay {
      font-size: 13px;
      opacity: 0.85;
      margin-bottom: 18px;
    }

    .section-title {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.6;
    }

    .nav-btn {
      background: none;
      border: none;
      color: white;
      text-align: left;
      padding: 10px;
      margin-top: 5px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
    }

    .nav-btn:hover {
      background: rgba(0,200,200,0.2);
      color: #00ffff;
    }

    .content {
      flex: 1;
      background: #f5f5f5;
      padding: 40px;
      overflow-y: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 700px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .game-btn {
      display: block;
      width: 200px;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #00c8c8;
      color: black;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <div class="logo">☯ iHunter Game Hub</div>
  <div id="userDisplay">Not logged in</div>

  <div class="section-title">ACCOUNT</div>

  <!-- FIXED LOGIN BUTTON -->
  <button class="nav-btn" onclick="goLogin()">Login</button>

  <button class="nav-btn" onclick="show('profile')">Profile</button>
  <button class="nav-btn" onclick="show('logout')">Logout</button>

  <div class="section-title">INFO</div>
  <button class="nav-btn" onclick="show('rules')">Rules</button>
  <button class="nav-btn" onclick="show('logs')">Update Logs</button>

  <div class="section-title">GAMES</div>
  <button class="nav-btn" onclick="show('tetris')">Tetris</button>
  <button class="nav-btn" onclick="location.href='games/scramble/'">Scramble</button>

  <div class="section-title">LEGACY</div>
  <button class="nav-btn" onclick="show('chat')">Chat.Me</button>
</div>

<div class="content" id="content">
  <div class="card">
    <h1>Welcome</h1>
    <p>Select something from the sidebar.</p>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHgQJtwtBZ2C_5R_BJDa0rTSogX-zMG_8",
  authDomain: "ihunter-game-hub.firebaseapp.com",
  projectId: "ihunter-game-hub",
  storageBucket: "ihunter-game-hub.firebasestorage.app",
  messagingSenderId: "174875617061",
  appId: "1:174875617061:web:c1d0e8eeba5a62a33e9ccc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* AUTH */
onAuthStateChanged(auth, async (user) => {
  currentUser = user;

  const display = document.getElementById("userDisplay");

  if (!user) {
    display.innerText = "Not logged in";
    return;
  }

  let name = user.email;

  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) name = snap.data().username;
  } catch {}

  display.innerText = "👤 " + name;
});

/* FIXED LOGIN NAVIGATION */
window.goLogin = function () {
  // Works on GitHub Pages AND local server
  const path = window.location.pathname;

  if (path.includes("/")) {
    window.location.href = "./login/index.html";
  } else {
    window.location.href = "login/index.html";
  }
};

/* ROUTER */
window.show = function(page){

  const content = document.getElementById("content");

  if(page === "rules"){
    content.innerHTML = `<div class="card"><h1>Rules</h1><p>Rules to be determined.</p></div>`;
  }

  if(page === "logs"){
    content.innerHTML = `<div class="card"><h1>Update Logs</h1><p>Recent updates.</p></div>`;
  }

  if(page === "tetris"){
    content.innerHTML = `<div class="card"><h1>Tetris</h1></div>`;
  }

  if(page === "chat"){
    content.innerHTML = `<div class="card"><h1>Chat.Me</h1><p>Legacy system.</p></div>`;
  }

  if(page === "profile"){
    content.innerHTML = `<div class="card"><h1>Profile</h1><p>Load after login.</p></div>`;
  }

  if(page === "logout"){
    signOut(auth);
    currentUser = null;
    content.innerHTML = `<div class="card"><h1>Logged Out</h1></div>`;
  }
};

</script>

</body>
</html>
