<!DOCTYPE html>
<html>
<head>
  <title>iHunter Game Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #00c8c8;
    }

    #userDisplay {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .section-title {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.6;
      letter-spacing: 1px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: white;
      text-align: left;
      padding: 10px;
      margin-top: 5px;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.2s;
      font-size: 14px;
    }

    .nav-btn:hover {
      background: rgba(0,200,200,0.2);
      color: #00ffff;
    }

    .content {
      flex: 1;
      background: #f5f5f5;
      color: #111;
      padding: 40px;
      overflow-y: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 700px;
    }

    h1 {
      margin-top: 0;
    }

    .muted {
      opacity: 0.7;
    }

    .game-btn {
      display: block;
      width: 200px;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #00c8c8;
      color: black;
      transition: 0.2s;
    }

    .game-btn:hover {
      box-shadow: 0 0 10px #00c8c8;
      transform: scale(1.03);
    }
  </style>
</head>

<body>

<div class="sidebar">

  <div class="logo">☯ iHunter Game Hub</div>
  <div id="userDisplay">Not logged in</div>

  <!-- ACCOUNT -->
  <div class="section-title">ACCOUNT</div>
  <button class="nav-btn" onclick="location.href='login/'">Login</button>
  <button class="nav-btn" onclick="show('profile')">Profile</button>
  <button class="nav-btn" onclick="show('logout')">Logout</button>

  <!-- INFO -->
  <div class="section-title">INFO</div>
  <button class="nav-btn" onclick="show('rules')">Rules</button>
  <button class="nav-btn" onclick="show('logs')">Update Logs</button>

  <!-- GAMES -->
  <div class="section-title">GAMES</div>
  <button class="nav-btn" onclick="show('tetris')">Tetris</button>
  <button class="nav-btn" onclick="location.href='games/scramble/'">Scramble</button>

  <!-- LEGACY -->
  <div class="section-title">LEGACY</div>
  <button class="nav-btn" onclick="show('chat')">Chat.Me</button>

</div>

<div class="content" id="content">
  <div class="card">
    <h1>Welcome</h1>
    <p class="muted">Select something from the sidebar to begin.</p>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHgQJtwtBZ2C_5R_BJDa0rTSogX-zMG_8",
  authDomain: "ihunter-game-hub.firebaseapp.com",
  projectId: "ihunter-game-hub",
  storageBucket: "ihunter-game-hub.firebasestorage.app",
  messagingSenderId: "174875617061",
  appId: "1:174875617061:web:c1d0e8eeba5a62a33e9ccc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* AUTH STATE TRACKING */
onAuthStateChanged(auth, async (user) => {
  currentUser = user;

  const display = document.getElementById("userDisplay");

  if (user) {
    display.innerText = "Logged in: " + user.email;
  } else {
    display.innerText = "Not logged in";
  }
});

/* LOGIN GUARD */
function requireLogin(){
  if(!currentUser){
    document.getElementById("content").innerHTML = `
      <div class="card">
        <h1>Access Denied</h1>
        <p>You must be logged in.</p>
      </div>
    `;
    return false;
  }
  return true;
}

/* MAIN ROUTER */
window.show = async function(page){

  const content = document.getElementById("content");

  if(page === "rules"){
    content.innerHTML = `
      <div class="card">
        <h1>Rules</h1>
        <p>Rules to be determined.</p>
      </div>
    `;
  }

  if(page === "logs"){
    content.innerHTML = `
      <div class="card">
        <h1>Update Logs</h1>
        <p>
Recent update!

We have added a rules button, update logs, and two versions of Tetris.

Chat.Me is still in legacy development.
        </p>
      </div>
    `;
  }

  if(page === "tetris"){
    if(!requireLogin()) return;

    content.innerHTML = `
      <div class="card">
        <h1>Tetris</h1>
        <button class="game-btn" onclick="location.href='games/tetris/?speed=0.5'">Easy</button>
        <button class="game-btn" onclick="location.href='games/tetris/?speed=1'">Normal</button>
        <button class="game-btn" onclick="location.href='games/tetris/?speed=2'">Difficult</button>
      </div>
    `;
  }

  if(page === "chat"){
    content.innerHTML = `
      <div class="card">
        <h1>Chat.Me</h1>
        <p>Legacy system. Not active.</p>
        <p class="muted">Status: Archived</p>
      </div>
    `;
  }

  if(page === "profile"){
    if(!requireLogin()) return;

    const docRef = doc(db, "users", currentUser.uid);
    const snap = await getDoc(docRef);

    let username = snap.exists() ? snap.data().username : "Unknown";

    content.innerHTML = `
      <div class="card">
        <h1>Profile</h1>
        <p><b>Username:</b> ${username}</p>
        <p><b>Email:</b> ${currentUser.email}</p>
      </div>
    `;
  }

  if(page === "logout"){
    await signOut(auth);
    currentUser = null;

    content.innerHTML = `
      <div class="card">
        <h1>Logged Out</h1>
        <p>You have been logged out successfully.</p>
      </div>
    `;
  }
};

</script>

</body>
</html>
