<!DOCTYPE html>
<html>
<head>
  <title>iHunter Game Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
      color: #00c8c8;
    }

    .section-title {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.6;
      letter-spacing: 1px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: white;
      text-align: left;
      padding: 10px;
      margin-top: 5px;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.2s;
      font-size: 14px;
    }

    .nav-btn:hover {
      background: rgba(0,200,200,0.2);
      color: #00ffff;
    }

    /* CONTENT */
    .content {
      flex: 1;
      background: #f5f5f5;
      color: #111;
      padding: 40px;
      overflow-y: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 700px;
    }

    h1 {
      margin-top: 0;
    }

    .muted {
      opacity: 0.7;
    }

    .game-btn {
      display: block;
      width: 200px;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #00c8c8;
      color: black;
      transition: 0.2s;
    }

    .game-btn:hover {
      box-shadow: 0 0 10px #00c8c8;
      transform: scale(1.03);
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">☯ iHunter Game Hub</div>

  <!-- ACCOUNT -->
  <div class="section-title">ACCOUNT</div>
  <button class="nav-btn" onclick="location.href='login/'">Login</button>
  <button class="nav-btn" onclick="show('profile')">Profile</button>
  <button class="nav-btn" onclick="show('logout')">Logout</button>

  <!-- INFO -->
  <div class="section-title">INFO</div>
  <button class="nav-btn" onclick="show('rules')">Rules</button>
  <button class="nav-btn" onclick="show('logs')">Update Logs</button>

  <!-- GAMES -->
  <div class="section-title">GAMES</div>
  <button class="nav-btn" onclick="show('tetris')">Tetris</button>
  <button class="nav-btn" onclick="location.href='games/scramble/'">Scramble</button>

  <!-- LEGACY -->
  <div class="section-title">LEGACY</div>
  <button class="nav-btn" onclick="show('chat')">Chat.Me</button>

</div>

<!-- CONTENT -->
<div class="content" id="content">
  <div class="card">
    <h1>Welcome</h1>
    <p class="muted">Select something from the sidebar to begin.</p>
  </div>
</div>

<script>
function show(page){
  const content = document.getElementById("content");

  if(page === "rules"){
    content.innerHTML = `
      <div class="card">
        <h1>Rules</h1>
        <p>Rules to be determined.</p>
      </div>
    `;
  }

  if(page === "logs"){
    content.innerHTML = `
      <div class="card">
        <h1>Update Logs</h1>
        <p>
Recent update!

We have added a rules button, update logs, and we have added 2 different versions of tetris for beginners and more advanced users!

I, Hunter, would also like to say that we are currently still working on trying to get Chat.Me able to happen. We have been talking to counselors, tech officials here at Genoa, and more. It is only a matter of talking to BC.
        </p>
      </div>
    `;
  }

  if(page === "tetris"){
    content.innerHTML = `
      <div class="card">
        <h1>Tetris</h1>
        <button class="game-btn" onclick="location.href='games/tetris/?speed=0.5'">Easy</button>
        <button class="game-btn" onclick="location.href='games/tetris/?speed=1'">Normal</button>
        <button class="game-btn" onclick="location.href='games/tetris/?speed=2'">Difficult</button>
      </div>
    `;
  }

  if(page === "chat"){
    content.innerHTML = `
      <div class="card">
        <h1>Chat.Me</h1>
        <p>
          Chat.Me is a legacy project within the iHunter ecosystem.
          It is currently inactive but preserved for reference.
        </p>
        <p class="muted">
          Status: Legacy (Inactive)
        </p>
      </div>
    `;
  }

  if(page === "profile"){
    content.innerHTML = `
      <div class="card">
        <h1>Profile</h1>
        <p class="muted">Firebase connection coming next step.</p>
      </div>
    `;
  }

  if(page === "logout"){
    content.innerHTML = `
      <div class="card">
        <h1>Logout</h1>
        <p class="muted">Logout will be connected to Firebase auth soon.</p>
      </div>
    `;
  }
}
</script>

</body>
</html>
